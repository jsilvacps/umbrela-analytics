name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install pyinstaller==6.3.0 requests duckdb openpyxl pillow

      - name: Extract version from tag
        id: get_version
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Patch APP_VERSION in source
        shell: python
        run: |
          import re
          version = "${{ steps.get_version.outputs.VERSION }}"
          with open("analisador_macro_lock.py", "r", encoding="utf-8") as f:
              src = f.read()
          src = re.sub(r'APP_VERSION\s*=\s*"[^"]+"', f'APP_VERSION = "{version}"', src)
          with open("analisador_macro_lock.py", "w", encoding="utf-8") as f:
              f.write(src)
          print(f"Versão atualizada para {version}")

      - name: Build EXE with PyInstaller
        run: |
          pyinstaller `
            --onefile `
            --windowed `
            --icon "logo_umbrela_analytics.ico" `
            --add-data "logo_umbrela_analytics.png;." `
            --add-data "logo_umbrela_analytics.ico;." `
            --name "UmbrelaAnalytics" `
            analisador_macro_lock.py

      - name: Install Inno Setup
        run: |
          choco install innosetup --yes --no-progress

      - name: Build Setup installer
        run: |
          $version = "${{ steps.get_version.outputs.VERSION }}"
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DMyAppVersion=$version UmbrelaAnalytics_Setup.iss
        shell: pwsh

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Umbrela Analytics v${{ steps.get_version.outputs.VERSION }}"
          body: |
            ## Umbrela Analytics v${{ steps.get_version.outputs.VERSION }}

            ### Instalação (primeira vez)
            Baixe e execute **UmbrelaAnalytics_Setup_v${{ steps.get_version.outputs.VERSION }}.exe**

            ### Atualização automática
            O app detecta esta versão e atualiza sozinho — só clique em **Atualizar agora**.

            ---
            **Umbrela Tecnologia**
          files: |
            installer/UmbrelaAnalytics_Setup_v${{ steps.get_version.outputs.VERSION }}.exe
            dist/UmbrelaAnalytics.exe
          draft: false
          prerelease: false
